name-template: v$RESOLVED_VERSION
tag-template: v$RESOLVED_VERSION
categories:
  - title: ⭐️ Features
    labels:
      - "feature"
  - title: 🐞 Bug Fixes
    labels:
      - "bug"
  - title: 🛠 Improvements
    labels:
      - "enhancement"
  - title: 🛠 Dependency upgrades
    labels:
      - "dependency upgrade"
  - title: ⚙️ Build/CI
    labels:
      - "ci"
      - "task"
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
version-resolver:
  major:
    labels:
      - 'type: major'
  minor:
    labels:
      - 'type: minor'
  patch:
    labels:
      - 'type: patch'
  default: patch
template: |
  ## What's Changed

  $CHANGES

  ## Contributors

  $CONTRIBUTORS
