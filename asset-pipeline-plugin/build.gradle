buildscript {
    repositories {
        // mavenLocal()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'groovy'
    id 'java-library'
    id 'signing'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'org.graceframework.grace-plugin' version "$graceVersion"
    id 'org.graceframework.grace-gsp' version "$graceVersion"
}

group = "org.graceframework.plugins"

ext {
    isReleaseVersion = !version.endsWith('SNAPSHOT')
}

repositories {
    // mavenLocal()
    mavenCentral()
}

dependencies {
    compileOnly "org.springframework.boot:spring-boot-starter-actuator"
    compileOnly "org.springframework.boot:spring-boot-starter-logging"
    compileOnly "org.springframework.boot:spring-boot-starter-web"
    api "org.springframework.boot:spring-boot-autoconfigure"
    annotationProcessor "org.springframework.boot:spring-boot-autoconfigure-processor"
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
    compileOnly "org.graceframework:grace-boot"
    compileOnly "org.slf4j:slf4j-simple:2.0.20"
    implementation "org.graceframework:grace-plugin-taglibs"
    implementation "org.graceframework:grace-web-url-mappings"
    implementation "com.github.ben-manes.caffeine:caffeine"
    implementation project(":asset-pipeline-core"), {
        exclude group: "org.mozilla", module: "rhino"
        exclude group: "com.google.javascript", module: "closure-compiler-unshaded"
    }
    testImplementation "org.graceframework:grace-test-support"
    testImplementation "org.spockframework:spock-core:2.4-groovy-4.0"
}

bootRun {
    jvmArgs('-Dspring.output.ansi.enabled=always')
}

configure([compileGroovy, compileTestGroovy]) {
    groovyOptions.encoding = "UTF-8"
    options.encoding = "UTF-8"
    options.compilerArgs << '-parameters'
    options.forkOptions.memoryInitialSize = '128M'
    options.forkOptions.memoryMaximumSize = '1G'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

jar {
    archiveClassifier.set('')
    includeEmptyDirs = false
    manifest.attributes["Implementation-Title"] = project.name
    manifest.attributes["Implementation-Version"] = project.version
    manifest.attributes["Automatic-Module-Name"] = project.name.replace('-', '.')
    manifest.attributes["Created-By"] =
            "${System.getProperty("java.version")} (${System.getProperty("java.specification.vendor")})"

    from("${rootProject.projectDir}/src/main/resources/legal") {
        include "LICENSE.txt", "NOTICE.txt"
        into "META-INF"
        expand(copyright: new Date().format("yyyy"), version: project.version)
    }
}

test {
    useJUnitPlatform()
    testLogging {
        exceptionFormat = 'full'
        showStandardStreams = true
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'asset-pipeline-plugin'

            artifact source: layout.buildDirectory.file('classes/groovy/main/META-INF/grails-plugin.xml').get().asFile,
                    classifier: 'plugin',
                    extension: 'xml'

            pom {
                name = 'Grace Asset Pipeline Plugin'
                description = 'The Grace Asset-Pipeling plugin providing asset transpiling to Grace.'
                url = 'https://github.com/grace-plugins/grace-asset-pipeline'
                scm {
                    url = 'https://github.com/grace-plugins/grace-asset-pipeline'
                    connection = 'scm:https://github.com/grace-plugins/grace-asset-pipeline.git'
                    developerConnection = 'scm:git@github.com/grace-plugins/grace-asset-pipeline.git'
                }
                licenses {
                    license {
                        name = 'The Apache Software License, Version 2.0'
                        url = 'http://www.apache.org/license/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'rainboyan'
                        name = 'Michael Yan'
                        email = 'rain@rainboyan.com'
                    }
                }
            }

            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }

            from components.java
        }
    }
}
