plugins {
    id 'groovy'
    id 'java-library'
    id 'signing'
    id 'idea'
    id 'maven-publish'
}

group = 'org.graceframework.plugins'

ext.isReleaseVersion = !version.endsWith('SNAPSHOT')

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

jar {
    manifest.attributes["Implementation-Title"] = project.name
    manifest.attributes["Implementation-Version"] = project.version
    manifest.attributes["Automatic-Module-Name"] = project.name.replace('-', '.')
    manifest.attributes["Created-By"] =
            "${System.getProperty("java.version")} (${System.getProperty("java.specification.vendor")})"

    from("${rootProject.projectDir}/src/main/resources/legal") {
        include "LICENSE.txt", "NOTICE.txt"
        into "META-INF"
        expand(copyright: new Date().format("yyyy"), version: project.version)
    }
}

dependencies {
    compileOnly "org.apache.groovy:groovy:$groovyVersion"
    compileOnly "org.apache.groovy:groovy-json:$groovyVersion"
    compileOnly "org.apache.groovy:groovy-templates:$groovyVersion"
    // See gh-75: NoSuchMethodError
    compileOnly gradleApi()
    api 'org.mozilla:rhino:1.9.2'
    api "org.graalvm.sdk:graal-sdk:24.2.2"
    compileOnly "org.graalvm.js:js:24.2.2"
    compileOnly "org.graalvm.js:js-scriptengine:24.2.2"
    compileOnly "com.google.javascript:closure-compiler-unshaded:v20240317"
    compileOnly "org.slf4j:slf4j-simple:2.0.20"
    api 'org.slf4j:slf4j-api:2.0.20'
    testImplementation project(':asset-pipeline-classpath-test')
    testImplementation "org.apache.groovy:groovy-all:$groovyVersion"
    testImplementation "org.spockframework:spock-core:2.4-groovy-5.0"
    testImplementation "org.graalvm.js:js:24.2.2"
    testRuntimeOnly "org.slf4j:slf4j-simple:2.0.20"
}

publishing {
    publications {
        maven(MavenPublication) {
            artifactId = 'asset-pipeline-core'
            pom.withXml {
                asNode().children().last() + {
                    resolveStrategy = Closure.DELEGATE_FIRST
                    name 'Grace Asset Pipeline Core'
                    description 'Grace Asset Pipeline library for serving static web assets, bundling, minifying, and extensibility for transpiling.'
                    url 'https://github.com/grace-plugins/grace-asset-pipeline'
                    scm {
                        url 'https://github.com/grace-plugins/grace-asset-pipeline'
                        connection 'scm:https://github.com/grace-plugins/grace-asset-pipeline.git'
                        developerConnection 'scm:git@github.com/grace-plugins/grace-asset-pipeline.git'
                    }
                    licenses {
                        license {
                            name 'The Apache Software License, Version 2.0'
                            url 'http://www.apache.org/license/LICENSE-2.0.txt'
                            distribution 'repo'
                        }
                    }
                    developers {
                        developer {
                            id 'rainboyan'
                            name 'Michael Yan'
                            email 'rain@rainboyan.com'
                        }
                    }
                }
            }
            from components.java
        }
    }
}

test {
    useJUnitPlatform()
    testLogging {
        exceptionFormat = 'full'
        showStandardStreams = true
    }
}
