plugins {
    id('groovy')
    id('java-gradle-plugin')
    id('idea')
    id('maven-publish')
    id('com.gradle.plugin-publish') version '2.1.1'
}

group = 'org.graceframework.plugins'

ext.isReleaseVersion = !version.endsWith('SNAPSHOT')

repositories {
    // mavenLocal()
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    api gradleApi()
    api localGroovy()

    api project(':asset-pipeline-core')
    implementation 'org.graalvm.truffle:truffle-api:23.0.12'
    implementation 'org.graalvm.js:js:23.0.12'
    implementation 'org.graalvm.js:js-scriptengine:23.0.12'
    api 'com.google.javascript:closure-compiler-unshaded:v20240317'
    testImplementation('org.spockframework:spock-core:2.4-groovy-5.0')
}

test {
    testLogging {
        exceptionFormat = 'full'
        showStandardStreams = true
    }
}

gradlePlugin {
    website = 'https://github.com/grace-plugins/grace-asset-pipeline'
    vcsUrl = 'https://github.com/grace-plugins/grace-asset-pipeline.git'

    plugins {
        assetPipeline {
            id = 'org.graceframework.asset-pipeline'
            displayName = 'Grace Asset Pipeline Gradle Plugin'
            description = 'Asset-Pipeline is a plugin used for managing and processing static assets in Grace applications primarily via Gradle.'
            tags.set(['grace-framework', 'assets', 'asset-pipeline'])
            implementationClass = 'asset.pipeline.gradle.AssetPipelinePlugin'
        }
    }
}

afterEvaluate {
    signing {
        required = isReleaseVersion && gradle.taskGraph.hasTask("publish")
        Publication[] publications = new Publication[publishing.publications.size()]
        publishing.publications.findAll().toArray(publications)
        sign(publications)
    }
}

project.afterEvaluate {
    project.publishing.publications.each { MavenPublication publication->
        publication.pom {
            if (publication.name == "maven" || publication.name == "pluginMaven") {
                name = "Grace Asset Pipeline Gradle Plugin"
                description = "Asset-Pipeline is a plugin used for managing and processing static assets in Grace applications primarily via Gradle."
            }

            if (publication.name == "pluginMaven" || publication.name.endsWith("PluginMarkerMaven")) {
                url = 'https://github.com/grace-plugins/grace-asset-pipeline'

                licenses {
                    license {
                        name = 'The Apache Software License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }

                scm {
                    url = 'scm:git@github.com:grace-plugins/grace-asset-pipeline.git'
                    connection = 'scm:git@github.com:grace-plugins/grace-asset-pipeline.git'
                    developerConnection = 'scm:git@github.com:grace-plugins/grace-asset-pipeline.git'
                }

                developers {
                    developer {
                        id = 'rainboyan'
                        name = 'Michael Yan'
                        email = 'rain@rainboyan.com'
                    }
                }
            }
        }
    }
}